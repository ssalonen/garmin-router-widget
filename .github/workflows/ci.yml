name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run --group dev pytest -v --tb=short
        working-directory: backend

  widget:
    name: Widget tests (Monkey C)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get cache key (weekly)
        id: week
        run: echo "key=$(date +%Y-%U)" >> $GITHUB_OUTPUT

      - name: Cache Connect IQ Docker image
        id: cache-ciq
        uses: actions/cache@v4
        with:
          path: /tmp/connectiq.tar
          key: connectiq-${{ steps.week.outputs.key }}

      - name: Pull and save image (cache miss)
        if: steps.cache-ciq.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/matco/connectiq-tester:latest
          docker save ghcr.io/matco/connectiq-tester:latest -o /tmp/connectiq.tar

      - name: Load image (cache hit)
        if: steps.cache-ciq.outputs.cache-hit == 'true'
        run: docker load -i /tmp/connectiq.tar

      - name: Run Monkey C unit tests
        # To run locally (shows full output):
        #   docker run --rm -v "$PWD/widget:/app" --workdir /app \
        #     --entrypoint tester.sh ghcr.io/matco/connectiq-tester:latest \
        #     edge530 ""
        uses: matco/action-connectiq-tester@v1
        with:
          device: edge530
          path: widget
