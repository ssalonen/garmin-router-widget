name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CIQ_IMAGE: ghcr.io/ssalonen/garmin-router-widget/connectiq-builder:9.1.0

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact release: setup-uv stopped publishing moving major
      # tags (@v9) as of v8.0.0, so this has to be bumped by hand.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Run tests
        run: uv run --group dev pytest -v --tb=short
        working-directory: backend

  widget:
    name: Widget unit tests (Monkey C)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Get cache period key (14-day window)
        id: period
        run: echo "key=$(( $(date +%s) / 86400 / 14 ))" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Connect IQ builder image
        id: cache-builder
        uses: actions/cache@v6
        with:
          path: /tmp/connectiq-builder.tar
          key: ${{ env.CIQ_IMAGE }}-${{ steps.period.outputs.key }}

      - name: Pull and save builder image (cache miss)
        if: steps.cache-builder.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.CIQ_IMAGE }}
          docker save ${{ env.CIQ_IMAGE }} -o /tmp/connectiq-builder.tar

      - name: Load builder image (cache hit)
        if: steps.cache-builder.outputs.cache-hit == 'true'
        run: docker load -i /tmp/connectiq-builder.tar

      - name: Run Monkey C unit tests
        # Uses the repo's test/unit-test.sh instead of the image's built-in
        # tester.sh so we can fix runner logic without rebuilding the image.
        # To run locally:
        #   docker run --rm -v "$PWD/widget:/app" --workdir /app \
        #     --entrypoint /bin/bash \
        #     ghcr.io/ssalonen/garmin-router-widget/connectiq-builder:9.1.0 \
        #     /app/test/unit-test.sh edge530
        run: |
          docker run --rm \
            -v "$PWD/widget:/app" \
            --workdir /app \
            -e CONNECTIQ_HOME=/opt/connectiq-sdk \
            --entrypoint /bin/bash \
            ${{ env.CIQ_IMAGE }} \
            /app/test/unit-test.sh edge530

  e2e:
    name: E2E screenshot tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Get cache period key (14-day window)
        id: period
        run: echo "key=$(( $(date +%s) / 86400 / 14 ))" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Connect IQ builder image
        id: cache-builder
        uses: actions/cache@v6
        with:
          path: /tmp/connectiq-builder.tar
          key: ${{ env.CIQ_IMAGE }}-${{ steps.period.outputs.key }}

      - name: Pull and save builder image (cache miss)
        if: steps.cache-builder.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.CIQ_IMAGE }}
          docker save ${{ env.CIQ_IMAGE }} -o /tmp/connectiq-builder.tar

      - name: Load builder image (cache hit)
        if: steps.cache-builder.outputs.cache-hit == 'true'
        run: docker load -i /tmp/connectiq-builder.tar

      - name: Run E2E tests with mock API server
        # Mounts widget/ at /app inside the container.
        # e2e.sh starts mock_server.py, patches backendUrl to http://127.0.0.1:8765
        # in a temp copy of the source, compiles the widget, then runs five scenarios:
        #   A) normal — course list + navigate first course
        #   B) normal — scroll to second course + navigate
        #   C) error  — HTTP 500 → error state
        #   D) empty  — empty JSON list → "No courses found"
        #   E) many   — 8 courses (2 pages of 5) → scroll to page 2
        # Screenshots and run.log are written to widget/test-results/e2e/.
        run: |
          mkdir -p widget/test-results/e2e
          docker run --rm \
            -v "$PWD/widget:/app" \
            --workdir /app \
            -e CONNECTIQ_HOME=/opt/connectiq-sdk \
            --entrypoint /bin/bash \
            ${{ env.CIQ_IMAGE }} \
            /app/test/e2e.sh edge530 "" 2>&1 | tee widget/test-results/e2e/run.log
          exit ${PIPESTATUS[0]}

      - name: Generate HTML report
        if: always()
        run: |
          python3 widget/test/gen_report.py \
            --screenshots widget/test-results/e2e \
            --log        widget/test-results/e2e/run.log \
            --output     widget/test-results/e2e/report.html \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload e2e report
        id: upload
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report-${{ github.run_number }}
          path: widget/test-results/e2e/
          if-no-files-found: warn

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- e2e-report -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Find the job URL for this specific job so we can link directly
            // to its step summary (where the base64 screenshots are rendered).
            let jobUrl = runUrl;
            try {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                run_id: context.runId,
              });
              const job = data.jobs.find(j => j.name === 'E2E screenshot tests');
              if (job) jobUrl = job.html_url;
            } catch (_) {}

            // Parse PASS/FAIL lines from the log written by gen_report stdout
            // (also available in the step summary we just wrote).
            const fs   = require('fs');
            const log  = fs.existsSync('widget/test-results/e2e/run.log')
                         ? fs.readFileSync('widget/test-results/e2e/run.log', 'utf8')
                         : '';
            const pass = (log.match(/\[assert\] PASS '[^']+'/g) || [])
                           .map(l => l.replace("[assert] PASS '", '').replace("'", ''));
            const fail = (log.match(/\[assert\] FAIL '[^']+'/g) || [])
                           .map(l => l.replace("[assert] FAIL '", '').replace("'", ''));
            const icon = fail.length === 0 ? '✅' : '❌';

            let table = '| | Assertion |\n|-|-----------|\n';
            for (const l of pass) table += `| ✅ | ${l} |\n`;
            for (const l of fail) table += `| ❌ | ${l} |\n`;

            const body = [
              marker,
              `## ${icon} E2E screenshot tests — run [#${context.runNumber}](${jobUrl})`,
              '',
              table,
              `[📸 View full report with screenshots →](${jobUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
