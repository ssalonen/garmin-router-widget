name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Run tests
        run: pytest -v --tb=short
        working-directory: backend

  widget:
    name: Widget tests (Monkey C)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Monkey C unit tests
        uses: matco/action-connectiq-tester@v1
        with:
          # Runs (:test)-annotated functions in the simulator via Xvfb.
          # The action handles SDK download, compilation (monkeyc), and
          # test execution (monkeydo --test) headlessly.
          device: edge530
          path: widget
