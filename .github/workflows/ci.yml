name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Run tests
        run: pytest -v --tb=short
        working-directory: backend

  widget:
    name: Widget tests (Monkey C)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Monkey C unit tests
        # Run tester.sh directly (not via action's entrypoint.sh) so that
        # monkeyc/monkeydo output is visible in CI logs rather than hidden
        # behind ::debug:: annotations.
        run: |
          docker run --rm \
            -v "$PWD/widget:/app" \
            --workdir /app \
            --entrypoint tester.sh \
            ghcr.io/matco/connectiq-tester:latest \
            edge530 ""
