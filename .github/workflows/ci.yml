name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run --group dev pytest -v --tb=short
        working-directory: backend

  widget:
    name: Widget tests (Monkey C)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Monkey C unit tests
        # To run locally (shows full output):
        #   docker run --rm -v "$PWD/widget:/app" --workdir /app \
        #     --entrypoint tester.sh ghcr.io/matco/connectiq-tester:latest \
        #     edge530 ""
        uses: matco/action-connectiq-tester@v1
        with:
          device: edge530
          path: widget
