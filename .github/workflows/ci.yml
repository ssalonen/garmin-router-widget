name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run --group dev pytest -v --tb=short
        working-directory: backend

  widget:
    name: Widget tests (Monkey C)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get cache period key (14-day window)
        id: period
        run: echo "key=$(( $(date +%s) / 86400 / 14 ))" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Connect IQ builder image
        id: cache-builder
        uses: actions/cache@v4
        with:
          path: /tmp/connectiq-builder.tar
          key: connectiq-builder-${{ steps.period.outputs.key }}

      - name: Pull and save builder image (cache miss)
        if: steps.cache-builder.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/${{ github.repository }}/connectiq-builder:latest
          docker save ghcr.io/${{ github.repository }}/connectiq-builder:latest \
            -o /tmp/connectiq-builder.tar

      - name: Load builder image (cache hit)
        if: steps.cache-builder.outputs.cache-hit == 'true'
        run: docker load -i /tmp/connectiq-builder.tar

      - name: Run Monkey C unit tests
        # To run locally (shows full output):
        #   docker run --rm -v "$PWD/widget:/app" --workdir /app \
        #     ghcr.io/ssalonen/garmin-router-widget/connectiq-builder:latest \
        #     edge530
        run: |
          docker run --rm \
            -v "$PWD/widget:/app" \
            --workdir /app \
            ghcr.io/${{ github.repository }}/connectiq-builder:latest \
            edge530
