name: FIT download spike

# Answers one question: can the widget put a course on the device by
# downloading a FIT file (Communications.HTTP_RESPONSE_CONTENT_TYPE_FIT), so
# it becomes navigable content rather than a green label?
#
# Runs scenarios F/G/H from widget/test/e2e.sh (see the SPIKE block there).
# Deliberately a separate workflow so it never gates the main CI while the
# answer is still unknown.

on:
  workflow_dispatch:
  push:
    branches: [claude/green-navigation-mode-s6saqm]

env:
  CIQ_IMAGE: ghcr.io/ssalonen/garmin-router-widget/connectiq-builder:9.1.0

jobs:
  fit-encoder:
    name: FIT encoder unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Run FIT encoder tests
        # -s so the payload-size comparison shows up in the job log.
        run: uv run --group dev pytest tests/test_fit.py -v -s --tb=short
        working-directory: backend

  fit-spike:
    name: FIT download spike (simulator)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Get cache period key (14-day window)
        id: period
        run: echo "key=$(( $(date +%s) / 86400 / 14 ))" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Connect IQ builder image
        id: cache-builder
        uses: actions/cache@v6
        with:
          path: /tmp/connectiq-builder.tar
          key: ${{ env.CIQ_IMAGE }}-${{ steps.period.outputs.key }}

      - name: Pull and save builder image (cache miss)
        if: steps.cache-builder.outputs.cache-hit != 'true'
        run: |
          docker pull ${{ env.CIQ_IMAGE }}
          docker save ${{ env.CIQ_IMAGE }} -o /tmp/connectiq-builder.tar

      - name: Load builder image (cache hit)
        if: steps.cache-builder.outputs.cache-hit == 'true'
        run: docker load -i /tmp/connectiq-builder.tar

      - name: Run FIT spike scenarios
        # backend/ is mounted so mock_server.py can import the real fit.py —
        # the spike must exercise the bytes the backend would actually send,
        # not a reimplementation.
        # SPIKE_ONLY=1 skips scenarios A-E; the main CI workflow covers those.
        run: |
          mkdir -p widget/test-results/e2e
          docker run --rm \
            -v "$PWD/widget:/app" \
            -v "$PWD/backend:/backend:ro" \
            --workdir /app \
            -e CONNECTIQ_HOME=/opt/connectiq-sdk \
            -e SPIKE=1 \
            -e SPIKE_ONLY=1 \
            --entrypoint /bin/bash \
            ${{ env.CIQ_IMAGE }} \
            /app/test/e2e.sh edge530 "" 2>&1 | tee widget/test-results/e2e/run.log
          exit ${PIPESTATUS[0]}

      - name: Spike verdict
        if: always()
        run: |
          log=widget/test-results/e2e/run.log
          {
            echo "## FIT download spike"
            echo
            echo '### Response codes'
            echo '```'
            grep -E 'FIT_REQUEST|FIT_RESULT|PERSISTED_' "$log" || echo '(no FIT lines captured)'
            echo '```'
            echo
            echo '### Assertions'
            echo '| | Assertion |'
            echo '|-|-----------|'
            grep -oE "\[assert\] (PASS|FAIL) '[^']+'" "$log" | while read -r line; do
              name=${line#*\'}; name=${name%\'}
              case "$line" in
                *PASS*) echo "| ✅ | $name |" ;;
                *)      echo "| ❌ | $name |" ;;
              esac
            done
            echo
            echo '### Content store'
            echo '```'
            sed -n '/── simulator content store ──/,/── end content store ──/p' "$log" | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload spike artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fit-spike-${{ github.run_number }}
          path: widget/test-results/e2e/
          if-no-files-found: warn
