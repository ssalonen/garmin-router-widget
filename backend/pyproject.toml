[project]
name = "garmin-router-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.0",
    "uvicorn[standard]>=0.54.0",
    "garminconnect>=0.3.19",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Transport for starlette's TestClient. Starlette >=1.6 deprecates httpx 0.x
    # here in favour of httpx2.
    "httpx2>=2.16.0",
    "pytest-mock>=3.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
