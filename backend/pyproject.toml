[project]
name = "garmin-router-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.53.0",
    "garminconnect>=0.3.17",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Transport for starlette's TestClient. Starlette >=1.6 deprecates httpx 0.x
    # here in favour of httpx2.
    "httpx2>=2.13.1",
    "pytest-mock>=3.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
